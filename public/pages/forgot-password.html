<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forgot password | CancerInsight</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="styles/forgot-password.css">
    </head>
    <body>
        <main id="reset-box">
            <section id="request-view">
                <div class="icon-circle" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="8" cy="15" r="4"></circle>
                        <path d="M10.85 12.15 19 4"></path>
                        <path d="M18 5l2 2"></path>
                        <path d="M15 8l2 2"></path>
                    </svg>
                </div>

                <div class="card-header">
                    <h1>Forgot your password?</h1>
                    <p class="subtitle">Enter email to reset password.</p>
                </div>

                <form id="reset-form" method="post" action="forgot-password.php">
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" autocomplete="email" placeholder="name@example.com" required>
                    </div>

                    <input type="submit" value="Send reset link" class="primary-button">
                </form>
            </section>

            <!-- CONFIRMATION TO BE COMPLETED PROPERLY-->
            <section id="sent-view" hidden>
                <div class="icon-circle" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="m3 7 9 6 9-6"></path>
                    </svg>
                </div>

                <div class="card-header">
                    <h1>Check your email</h1>
                    <p class="subtitle">A reset link is on its way! Link expires in 30 minutes.</p>
                </div>

                <a href="forgot-password.html" class="secondary-button">Use a different email</a>
            </section>

            <a href="login.html" class="back-link">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5"></path>
                    <path d="m12 19-7-7 7-7"></path>
                </svg>
                Back to sign in
            </a>
        </main>
    </body>
</html>
